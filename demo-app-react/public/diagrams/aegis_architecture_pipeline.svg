</marker></defs><rect width="1600" height="1050" fill="#0b1118" rx="24" /><rect x="36" y="36" width="1528" height="978" class="frame" rx="24" /><text class="page-title mono" x="60" y="44">AEGIS v0.9 BETA | ENFORCEMENT PIPELINE</text><text class="page-subtitle" x="60" y="68">The host executes. AEGIS authorizes, validates, and emits separate invocation and workflow evidence.</text><rect x="60" y="94" width="1480" height="106" rx="24" class="band" /><text class="section-tag mono" x="84" y="118">HOST OWNERSHIP</text><rect x="92" y="130" width="286" height="48" rx="14" class="host-box" /><text class="box-title" x="235" y="154.0" text-anchor="middle">orchestration</text><rect x="400" y="130" width="286" height="48" rx="14" class="host-box" /><text class="box-title" x="543" y="154.0" text-anchor="middle">provider / tool call</text><rect x="708" y="130" width="286" height="48" rx="14" class="host-box" /><text class="box-title" x="851" y="154.0" text-anchor="middle">credentials + retries</text><rect x="1016" y="124" width="492" height="60" rx="18" class="note-box" /><text class="body" x="1262" y="144.0" text-anchor="middle">Execution remains outside AEGIS.</text><text class="small" x="1262" y="166.0" text-anchor="middle">The host calls the model only after authorization.</text><rect x="60" y="224" width="1480" height="146" rx="24" class="workflow-panel" /><text class="section-tag mono" x="84" y="248">WORKFLOW COORDINATION</text><rect x="92" y="270" width="246" height="70" rx="18" class="node-workflow" /><text class="box-title" x="215" y="305.0" text-anchor="middle">AEGIS.open_session()</text><rect x="364" y="270" width="246" height="70" rx="18" class="node-workflow" /><text class="box-title" x="487" y="305.0" text-anchor="middle">GovernanceSession</text><rect x="636" y="270" width="274" height="70" rx="18" class="node-workflow" /><text class="box-title" x="773" y="293.5" text-anchor="middle">SessionPreCallResult</text><text class="box-sub" x="773" y="319.0" text-anchor="middle">single-use step token</text><rect x="936" y="270" width="246" height="70" rx="18" class="node-policy" /><text class="box-title" x="1059" y="293.5" text-anchor="middle">Workflow policy</text><text class="box-sub" x="1059" y="319.0" text-anchor="middle">sequence, budgets, approvals</text><rect x="1208" y="270" width="300" height="70" rx="18" class="node-evidence" /><text class="box-title" x="1358" y="293.5" text-anchor="middle">Workflow artifact</text><text class="box-sub" x="1358" y="319.0" text-anchor="middle">separate session evidence</text><rect x="60" y="394" width="1480" height="420" rx="24" class="kernel-panel" /><text class="section-tag mono" x="84" y="418">DETERMINISTIC INVOCATION PIPELINE</text><text class="panel-title mono" x="96" y="456">PHASE A | AUTHORIZE BEFORE EXECUTION</text><rect x="96" y="474" width="188" height="68" rx="18" class="node-kernel" /><text class="box-title" x="190" y="494.0" text-anchor="middle">Policy load</text><text class="box-title" x="190" y="522.0" text-anchor="middle">+ validation</text><rect x="306" y="474" width="188" height="68" rx="18" class="node-kernel" /><text class="box-title" x="400" y="508.0" text-anchor="middle">pre_authorization</text><rect x="516" y="474" width="188" height="68" rx="18" class="node-kernel" /><text class="box-title" x="610" y="508.0" text-anchor="middle">guards + role</text><rect x="726" y="474" width="210" height="68" rx="18" class="node-kernel" /><text class="box-title" x="831" y="508.0" text-anchor="middle">preconditions + tools</text><rect x="958" y="474" width="210" height="68" rx="18" class="node-kernel" /><text class="box-title" x="1063" y="508.0" text-anchor="middle">post_authorization</text><rect x="1190" y="468" width="318" height="80" rx="18" class="note-box" /><text class="body" x="1349" y="488.0" text-anchor="middle">Authorization result</text><text class="small" x="1349" y="510.0" text-anchor="middle">Split and session paths pause here</text><text class="small" x="1349" y="530.0" text-anchor="middle">for the host-owned call.</text><rect x="96" y="574" width="1412" height="62" rx="18" class="adapter-panel" /><text class="body-plus" x="802" y="594.5" text-anchor="middle">HOST EXECUTION BOUNDARY</text><text class="small-plus" x="802" y="617.5" text-anchor="middle">provider / tool call occurs here only after Phase A succeeds</text><text class="panel-title mono" x="96" y="674">PHASE B | VALIDATE OUTPUT + EMIT EVIDENCE</text><rect x="96" y="692" width="188" height="68" rx="18" class="node-kernel" /><text class="box-title" x="190" y="726.0" text-anchor="middle">pre_output</text><rect x="306" y="692" width="188" height="68" rx="18" class="node-kernel" /><text class="box-title" x="400" y="726.0" text-anchor="middle">output schema</text><rect x="516" y="692" width="188" height="68" rx="18" class="node-kernel" /><text class="box-title" x="610" y="726.0" text-anchor="middle">postconditions</text><rect x="726" y="692" width="188" height="68" rx="18" class="node-kernel" /><text class="box-title" x="820" y="726.0" text-anchor="middle">post_output</text><rect x="936" y="692" width="188" height="68" rx="18" class="node-kernel" /><text class="box-title" x="1030" y="726.0" text-anchor="middle">risk scoring</text><rect x="1146" y="692" width="362" height="68" rx="18" class="node-evidence" /><text class="box-title" x="1327" y="714.5" text-anchor="middle">Invocation artifact</text><text class="box-sub" x="1327" y="740.0" text-anchor="middle">PASS or FAIL per attempt</text><rect x="60" y="838" width="1480" height="126" rx="24" class="evidence-panel" /><text class="section-tag mono" x="84" y="862">EVIDENCE + OPERATOR TOOLING</text><rect x="92" y="884" width="250" height="54" rx="14" class="node-evidence" /><text class="box-title" x="217" y="911.0" text-anchor="middle">AuditSink + optional signing</text><rect x="366" y="884" width="250" height="54" rx="14" class="node-ops" /><text class="box-title" x="491" y="911.0" text-anchor="middle">aegis workflow trace</text><rect x="640" y="884" width="250" height="54" rx="14" class="node-ops" /><text class="box-title" x="765" y="911.0" text-anchor="middle">aegis workflow export</text><rect x="914" y="884" width="250" height="54" rx="14" class="node-adapter" /><text class="box-title" x="1039" y="899.5" text-anchor="middle">Bedrock / A2A</text><text class="box-sub" x="1039" y="925.0" text-anchor="middle">optional adapters</text><rect x="1188" y="884" width="320" height="54" rx="14" class="node-adapter" /><text class="box-title" x="1348" y="899.5" text-anchor="middle">OpenAI Agents adapter</text><text class="box-sub" x="1348" y="925.0" text-anchor="middle">optional extra</text><text class="footer-note" x="60" y="1002.0" text-anchor="start">Split enforcement has been the @governed default since v0.3.3; unified enforcement preserves the same gate order.</text><path class="connector" d="M338 305 H364" marker-end="url(#arrow)" /><path class="connector" d="M610 305 H636" marker-end="url(#arrow)" /><path class="connector" d="M910 305 H936" marker-end="url(#arrow)" /><path class="connector" d="M1060 340 V394 H190 V474" marker-end="url(#arrow)" /><path class="connector" d="M284 508 H306" marker-end="url(#arrow)" /><path class="connector" d="M494 508 H516" marker-end="url(#arrow)" /><path class="connector" d="M704 508 H726" marker-end="url(#arrow)" /><path class="connector" d="M936 508 H958" marker-end="url(#arrow)" /><path class="connector" d="M1063 542 V574" marker-end="url(#arrow)" /><path class="connector" d="M1063 636 V660 H190 V692" marker-end="url(#arrow)" /><path class="connector" d="M284 726 H306" marker-end="url(#arrow)" /><path class="connector" d="M494 726 H516" marker-end="url(#arrow)" /><path class="connector" d="M704 726 H726" marker-end="url(#arrow)" /><path class="connector" d="M914 726 H936" marker-end="url(#arrow)" /><path class="connector" d="M1124 726 H1146" marker-end="url(#arrow)" /><path class="connector" d="M1327 760 V814 H216 V884" marker-end="url(#arrow)" /><path class="connector-muted" d="M1327 760 V814 H1358 V884" marker-end="url(#arrow-muted)" /><path class="connector-muted" d="M1358 340 V838" marker-end="url(#arrow-muted)" /></svg>
