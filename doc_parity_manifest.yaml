# --- Documentation parity set ---
# These docs must stay synchronized with implementation.
# The parity checker validates consistency across them.

parity_docs:
  - README.md
  - PROJECT.md
  - CHANGELOG.md
  - docs/AEGIS_FRAMEWORK.md
  - docs/INTEGRATION_GUIDE.md
  - docs/PUBLIC_INTEGRATION_CONTRACT.md
  - docs/architecture/ARCHITECTURAL_INVARIANTS.md
  - docs/architecture/ENFORCEMENT_PIPELINE.md

# --- Runtime onboarding boundary docs ---
# These current-runtime docs must explicitly fence off planned-only surfaces so
# readers are not routed toward unsupported APIs or CLI commands.

availability_boundary_docs:
  - docs/PUBLIC_INTEGRATION_CONTRACT.md

# --- Target-state docs ---
# These intentionally describe planned or future-state contracts and are not
# used as current-release parity truth. The parity checker enforces them
# through a separate target-state contract check.

target_state_docs:
  - docs/architecture/AEGIS_HIGH_LEVEL_DESIGN.md

# --- Canonical gate IDs (from aegis/_internal/enforcement.py) ---
# Used by the parity checker to detect gate-ID naming drift in docs.

canonical_gate_ids:
  - guard_evaluation
  - role_validation
  - precondition_validation
  - tool_constraint_validation
  - schema_validation
  - postcondition_validation
  - risk_scoring

# --- Docs excluded from public-API-boundary checks ---
# These may reference aegis._internal without failing the check,
# because they are internal engineering docs (not user-facing).

internal_docs:
