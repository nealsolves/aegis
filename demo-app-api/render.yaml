services:
  - type: web
    name: aegis-demo-api
    runtime: python
    branch: main
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    buildCommand: pip install -e . && pip install -r demo-app-api/requirements.txt
    startCommand: uvicorn main:app --app-dir demo-app-api --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
