services:
  - type: web
    name: aegis-demo-api
    runtime: python
    rootDir: demo-app-api
    branch: develop
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    buildCommand: pip install -e ../ && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
