policy_version: "1.0"
description: "Fictional Atlas support governance policy"
roles:
  - support
pre_conditions:
  required:
    disruption_type:
      type: string
      enum:
        - storm
    travel_impact:
      type: string
      enum:
        - missed_connection
post_conditions:
  required:
    - output_schema_valid
output_schema:
  type: object
  additionalProperties: false
  required:
    - coverage_decision
    - policy_citation
    - reply
  properties:
    coverage_decision:
      type: string
      enum:
        - not_covered
    policy_citation:
      type: string
      enum:
        - BRV-04
    reply:
      type: string
