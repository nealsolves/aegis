policy_version: "1.0"
description: "Fictional Meridian invoice workflow policy"
roles:
  - accounts_payable
  - vendor_verifier
  - risk_reviewer
  - payment_authorizer
pre_conditions:
  required:
    amount:
      type: number
      maximum: 50000
    fictional_case_id:
      type: string
      pattern: "^MV-[0-9]+$"
    payment_request_id:
      type: string
      pattern: "^PAYMENT-MV-[0-9]+$"
    vendor_id:
      type: string
      pattern: "^M-[0-9]+$"
post_conditions:
  required:
    - output_schema_valid
output_schema:
  type: object
  additionalProperties: false
  required:
    - record
    - status
    - step_id
  properties:
    record:
      type: string
    status:
      type: string
    step_id:
      type: string
tools:
  allowed_tools:
    - name: fictional_vendor_lookup
      max_calls: 1
    - name: authorize_payment
      max_calls: 1
workflow:
  max_steps: 4
  max_total_tool_calls: 2
  participants:
    - id: meridian-invoice-01
      roles:
        - accounts_payable
    - id: meridian-vendor-01
      roles:
        - vendor_verifier
    - id: meridian-risk-01
      roles:
        - risk_reviewer
    - id: meridian-payment-authorizer-01
      roles:
        - payment_authorizer
  required_sequence:
    - invoice_intake
    - vendor_verification
    - risk_review
    - payment_authorization
  allowed_transitions:
    invoice_intake:
      - vendor_verification
    vendor_verification:
      - risk_review
    risk_review:
      - payment_authorization
    payment_authorization: []
  allowed_agent_roles:
    - accounts_payable
    - vendor_verifier
    - risk_reviewer
    - payment_authorizer
  handoffs:
    - from: meridian-invoice-01
      to: meridian-vendor-01
    - from: meridian-vendor-01
      to: meridian-risk-01
    - from: meridian-risk-01
      to: meridian-payment-authorizer-01
