policy_version: "1.0"
description: "Fictional Meridian invoice workflow policy"
roles:
  - accounts_payable
  - vendor_verifier
  - risk_reviewer
  - payment_preparer
  - finance_approver
pre_conditions:
  required:
    amount:
      type: number
      maximum: 50000
    fictional_case_id:
      type: string
      pattern: "^MV-[0-9]+$"
    payment_preparation_record:
      type: string
      pattern: "^NO-OP-PAYMENT-"
    vendor_id:
      type: string
      pattern: "^M-[0-9]+$"
post_conditions:
  required:
    - output_schema_valid
output_schema:
  type: object
  additionalProperties: false
  required:
    - record
    - status
    - step_id
  properties:
    record:
      type: string
    status:
      type: string
    step_id:
      type: string
tools:
  allowed_tools:
    - name: fictional_vendor_lookup
      max_calls: 1
    - name: prepare_no_op_payment_record
      max_calls: 1
workflow:
  max_steps: 5
  max_total_tool_calls: 2
  participants:
    - id: meridian-invoice-01
      roles:
        - accounts_payable
    - id: meridian-vendor-01
      roles:
        - vendor_verifier
    - id: meridian-risk-01
      roles:
        - risk_reviewer
    - id: meridian-payment-01
      roles:
        - payment_preparer
    - id: meridian-approver-01
      roles:
        - finance_approver
  required_sequence:
    - invoice_intake
    - vendor_verification
    - risk_review
    - payment_preparation
    - approval
  allowed_transitions:
    invoice_intake:
      - vendor_verification
    vendor_verification:
      - risk_review
    risk_review:
      - payment_preparation
    payment_preparation:
      - approval
    approval: []
  allowed_agent_roles:
    - accounts_payable
    - vendor_verifier
    - risk_reviewer
    - payment_preparer
    - finance_approver
  handoffs:
    - from: meridian-invoice-01
      to: meridian-vendor-01
    - from: meridian-vendor-01
      to: meridian-risk-01
    - from: meridian-risk-01
      to: meridian-payment-01
    - from: meridian-payment-01
      to: meridian-approver-01
  escalation:
    require_approval_for_roles:
      - finance_approver
