</marker></defs><rect width="1600" height="1210" fill="#0b1118" rx="24" /><rect x="36" y="36" width="1528" height="1138" class="frame" rx="24" /><text class="page-title mono" x="60" y="44">AEGIS v0.9 BETA | ENFORCEMENT PIPELINE</text><text class="page-subtitle" x="60" y="68">The host executes. AEGIS authorizes, validates, and emits separate invocation and workflow evidence.</text><rect x="60" y="90" width="1480" height="140" rx="24" class="band" /><text class="section-tag mono" x="84" y="118">HOST OWNERSHIP</text><rect x="90" y="145" width="270" height="54" rx="14" class="host-box" data-node-id="host-orchestration" /><text class="box-title-compact" x="225.0" y="177.0" text-anchor="middle">orchestration</text><rect x="390" y="145" width="270" height="54" rx="14" class="host-box" data-node-id="host-provider-call" /><text class="box-title-compact" x="525.0" y="177.0" text-anchor="middle">provider / tool call</text><rect x="690" y="145" width="270" height="54" rx="14" class="host-box" data-node-id="host-credentials" /><text class="box-title-compact" x="825.0" y="177.0" text-anchor="middle">credentials + retries</text><rect x="1000" y="135" width="500" height="76" rx="16" class="note-box" /><text class="body" x="1250.0" y="168.5" text-anchor="middle">Execution remains outside AEGIS.</text><text class="small" x="1250.0" y="188.4" text-anchor="middle">The host acts only after authorization.</text><rect x="60" y="260" width="1480" height="160" rx="24" class="workflow-panel" /><text class="section-tag mono" x="84" y="288">WORKFLOW COORDINATION</text><rect x="90" y="315" width="230" height="70" rx="16" class="node-workflow" data-node-id="pipeline-open-session" /><text class="box-title-compact" x="205.0" y="355.0" text-anchor="middle">AEGIS.open_session()</text><rect x="350" y="315" width="230" height="70" rx="16" class="node-workflow" data-node-id="pipeline-session" /><text class="box-title-compact" x="465.0" y="355.0" text-anchor="middle">GovernanceSession</text><rect x="610" y="315" width="250" height="70" rx="16" class="node-workflow" data-node-id="pipeline-token" /><text class="box-title-compact" x="735.0" y="345.5" text-anchor="middle">SessionPreCallResult</text><text class="box-sub-compact" x="735.0" y="365.4" text-anchor="middle">single-use step token</text><rect x="890" y="315" width="250" height="70" rx="16" class="node-policy" data-node-id="pipeline-workflow-policy" /><text class="box-title-compact" x="1015.0" y="345.5" text-anchor="middle">Workflow policy</text><text class="box-sub-compact" x="1015.0" y="365.4" text-anchor="middle">sequence / budgets / approvals</text><rect x="1170" y="315" width="330" height="70" rx="16" class="node-evidence" data-node-id="pipeline-workflow-artifact" /><text class="box-title-compact" x="1335.0" y="345.5" text-anchor="middle">Workflow artifact</text><text class="box-sub-compact" x="1335.0" y="365.4" text-anchor="middle">separate session evidence</text><rect x="304" y="292" width="62" height="20" rx="7" class="connector-label-fill" data-connector-label="workflow-open" /><text class="connector-label mono" x="335.0" y="306.0" text-anchor="middle">opens</text><path class="connector" d="M 320 350 L 350 350" data-connector-id="workflow-open" data-from="pipeline-open-session" data-to="pipeline-session" marker-end="url(#arrow)" /><rect x="548" y="392" width="94" height="20" rx="7" class="connector-label-fill" data-connector-label="workflow-authorize" /><text class="connector-label mono" x="595.0" y="406.0" text-anchor="middle">authorizes</text><path class="connector" d="M 580 350 L 610 350" data-connector-id="workflow-authorize" data-from="pipeline-session" data-to="pipeline-token" marker-end="url(#arrow)" /><rect x="844" y="292" width="62" height="20" rx="7" class="connector-label-fill" data-connector-label="token-checks-policy" /><text class="connector-label mono" x="875.0" y="306.0" text-anchor="middle">checks</text><path class="connector" d="M 860 350 L 890 350" data-connector-id="token-checks-policy" data-from="pipeline-token" data-to="pipeline-workflow-policy" marker-end="url(#arrow)" /><rect x="1122" y="392" width="68" height="20" rx="7" class="connector-label-fill" data-connector-label="policy-to-workflow-artifact" /><text class="connector-label mono" x="1156.0" y="406.0" text-anchor="middle">records</text><path class="connector-muted" d="M 1140 350 L 1170 350" data-connector-id="policy-to-workflow-artifact" data-from="pipeline-workflow-policy" data-to="pipeline-workflow-artifact" marker-end="url(#arrow-muted)" /><rect x="60" y="450" width="1480" height="450" rx="24" class="kernel-panel" /><text class="section-tag mono" x="84" y="478">DETERMINISTIC INVOCATION PIPELINE</text><text class="panel-title mono" x="90" y="510">PHASE A | AUTHORIZE BEFORE HOST EXECUTION</text><rect x="90" y="540" width="160" height="70" rx="16" class="node-kernel" data-node-id="pipeline-policy-load" /><text class="box-title-compact" x="170.0" y="568.5" text-anchor="middle">Policy load</text><text class="box-title-compact" x="170.0" y="591.5" text-anchor="middle">+ validation</text><rect x="280" y="540" width="160" height="70" rx="16" class="node-kernel" data-node-id="pipeline-pre-auth" /><text class="box-title-compact" x="360.0" y="580.0" text-anchor="middle">pre_authorization</text><rect x="470" y="540" width="160" height="70" rx="16" class="node-kernel" data-node-id="pipeline-guards-role" /><text class="box-title-compact" x="550.0" y="580.0" text-anchor="middle">guards + role</text><rect x="660" y="540" width="190" height="70" rx="16" class="node-kernel" data-node-id="pipeline-preconditions" /><text class="box-title-compact" x="755.0" y="580.0" text-anchor="middle">preconditions + tools</text><rect x="880" y="540" width="180" height="70" rx="16" class="node-kernel" data-node-id="pipeline-post-auth" /><text class="box-title-compact" x="970.0" y="580.0" text-anchor="middle">post_authorization</text><rect x="1190" y="520" width="300" height="90" rx="16" class="node-adapter" data-node-id="pipeline-host-execution" /><text class="box-title-compact" x="1340.0" y="551.0" text-anchor="middle">HOST EXECUTION</text><text class="box-sub-compact" x="1340.0" y="570.9" text-anchor="middle">one provider call, tool action,</text><text class="box-sub-compact" x="1340.0" y="589.9" text-anchor="middle">or workflow step</text><rect x="244" y="616" width="42" height="20" rx="7" class="connector-label-fill" data-connector-label="load-to-pre-auth" /><text class="connector-label mono" x="265.0" y="630.0" text-anchor="middle">then</text><path class="connector" d="M 250 575 L 280 575" data-connector-id="load-to-pre-auth" data-from="pipeline-policy-load" data-to="pipeline-pre-auth" marker-end="url(#arrow)" /><rect x="434" y="504" width="42" height="20" rx="7" class="connector-label-fill" data-connector-label="pre-auth-to-guards" /><text class="connector-label mono" x="455.0" y="518.0" text-anchor="middle">then</text><path class="connector" d="M 440 575 L 470 575" data-connector-id="pre-auth-to-guards" data-from="pipeline-pre-auth" data-to="pipeline-guards-role" marker-end="url(#arrow)" /><rect x="624" y="616" width="42" height="20" rx="7" class="connector-label-fill" data-connector-label="guards-to-preconditions" /><text class="connector-label mono" x="645.0" y="630.0" text-anchor="middle">then</text><path class="connector" d="M 630 575 L 660 575" data-connector-id="guards-to-preconditions" data-from="pipeline-guards-role" data-to="pipeline-preconditions" marker-end="url(#arrow)" /><rect x="844" y="504" width="42" height="20" rx="7" class="connector-label-fill" data-connector-label="preconditions-to-post-auth" /><text class="connector-label mono" x="865.0" y="518.0" text-anchor="middle">then</text><path class="connector" d="M 850 575 L 880 575" data-connector-id="preconditions-to-post-auth" data-from="pipeline-preconditions" data-to="pipeline-post-auth" marker-end="url(#arrow)" /><rect x="1068" y="616" width="142" height="20" rx="7" class="connector-label-fill" data-connector-label="authorization-to-host" /><text class="connector-label mono" x="1139.0" y="630.0" text-anchor="middle">authorized host action</text><path class="connector" d="M 1060 575 L 1190 575" data-connector-id="authorization-to-host" data-from="pipeline-post-auth" data-to="pipeline-host-execution" marker-end="url(#arrow)" /><text class="panel-title mono" x="90" y="745">PHASE B | VALIDATE OUTPUT + EMIT EVIDENCE</text><rect x="90" y="770" width="160" height="70" rx="16" class="node-kernel" data-node-id="pipeline-pre-output" /><text class="box-title-compact" x="170.0" y="810.0" text-anchor="middle">pre_output</text><rect x="280" y="770" width="160" height="70" rx="16" class="node-kernel" data-node-id="pipeline-output-schema" /><text class="box-title-compact" x="360.0" y="810.0" text-anchor="middle">output schema</text><rect x="470" y="770" width="160" height="70" rx="16" class="node-kernel" data-node-id="pipeline-postconditions" /><text class="box-title-compact" x="550.0" y="810.0" text-anchor="middle">postconditions</text><rect x="660" y="770" width="160" height="70" rx="16" class="node-kernel" data-node-id="pipeline-post-output" /><text class="box-title-compact" x="740.0" y="810.0" text-anchor="middle">post_output</text><rect x="850" y="770" width="160" height="70" rx="16" class="node-kernel" data-node-id="pipeline-risk" /><text class="box-title-compact" x="930.0" y="810.0" text-anchor="middle">risk scoring</text><rect x="1120" y="760" width="370" height="80" rx="16" class="node-evidence" data-node-id="pipeline-invocation-artifact" /><text class="box-title-compact" x="1305.0" y="795.5" text-anchor="middle">Invocation artifact</text><text class="box-sub-compact" x="1305.0" y="815.4" text-anchor="middle">PASS or FAIL per attempt</text><rect x="1090" y="678" width="150" height="22" rx="7" class="connector-label-fill" data-connector-label="host-to-pre-output" /><text class="connector-label mono" x="1165.0" y="693.0" text-anchor="middle">host supplies output</text><path class="connector" d="M 1340 610 L 1340 710 L 170 710 L 170 770" data-connector-id="host-to-pre-output" data-from="pipeline-host-execution" data-to="pipeline-pre-output" marker-end="url(#arrow)" /><rect x="244" y="846" width="42" height="20" rx="7" class="connector-label-fill" data-connector-label="pre-output-to-schema" /><text class="connector-label mono" x="265.0" y="860.0" text-anchor="middle">then</text><path class="connector" d="M 250 805 L 280 805" data-connector-id="pre-output-to-schema" data-from="pipeline-pre-output" data-to="pipeline-output-schema" marker-end="url(#arrow)" /><rect x="434" y="748" width="42" height="20" rx="7" class="connector-label-fill" data-connector-label="schema-to-postconditions" /><text class="connector-label mono" x="455.0" y="762.0" text-anchor="middle">then</text><path class="connector" d="M 440 805 L 470 805" data-connector-id="schema-to-postconditions" data-from="pipeline-output-schema" data-to="pipeline-postconditions" marker-end="url(#arrow)" /><rect x="624" y="846" width="42" height="20" rx="7" class="connector-label-fill" data-connector-label="postconditions-to-post-output" /><text class="connector-label mono" x="645.0" y="860.0" text-anchor="middle">then</text><path class="connector" d="M 630 805 L 660 805" data-connector-id="postconditions-to-post-output" data-from="pipeline-postconditions" data-to="pipeline-post-output" marker-end="url(#arrow)" /><rect x="814" y="748" width="42" height="20" rx="7" class="connector-label-fill" data-connector-label="post-output-to-risk" /><text class="connector-label mono" x="835.0" y="762.0" text-anchor="middle">then</text><path class="connector" d="M 820 805 L 850 805" data-connector-id="post-output-to-risk" data-from="pipeline-post-output" data-to="pipeline-risk" marker-end="url(#arrow)" /><rect x="1028" y="846" width="74" height="20" rx="7" class="connector-label-fill" data-connector-label="risk-to-invocation-artifact" /><text class="connector-label mono" x="1065.0" y="860.0" text-anchor="middle">emits</text><path class="connector" d="M 1010 805 L 1120 805" data-connector-id="risk-to-invocation-artifact" data-from="pipeline-risk" data-to="pipeline-invocation-artifact" marker-end="url(#arrow)" /><rect x="60" y="940" width="1480" height="130" rx="24" class="evidence-panel" /><text class="section-tag mono" x="84" y="968">EVIDENCE + OPERATOR TOOLING</text><rect x="90" y="1000" width="250" height="50" rx="14" class="node-evidence" data-node-id="pipeline-audit-sink" /><text class="box-title-compact" x="215.0" y="1030.0" text-anchor="middle">AuditSink + optional signing</text><rect x="370" y="1000" width="240" height="50" rx="14" class="node-ops" data-node-id="pipeline-trace" /><text class="box-title-compact" x="490.0" y="1030.0" text-anchor="middle">aegis workflow trace</text><rect x="640" y="1000" width="240" height="50" rx="14" class="node-ops" data-node-id="pipeline-export" /><text class="box-title-compact" x="760.0" y="1030.0" text-anchor="middle">aegis workflow export</text><rect x="910" y="1000" width="240" height="50" rx="14" class="node-adapter" data-node-id="pipeline-bedrock-a2a" /><text class="box-title-compact" x="1030.0" y="1020.5" text-anchor="middle">Bedrock / A2A</text><text class="box-sub-compact" x="1030.0" y="1040.4" text-anchor="middle">optional adapters</text><rect x="1180" y="1000" width="320" height="50" rx="14" class="node-adapter" data-node-id="pipeline-openai-adapter" /><text class="box-title-compact" x="1340.0" y="1020.5" text-anchor="middle">OpenAI Agents adapter</text><text class="box-sub-compact" x="1340.0" y="1040.4" text-anchor="middle">optional extra</text><rect x="570" y="885" width="112" height="22" rx="7" class="connector-label-fill" data-connector-label="invocation-artifact-to-sink" /><text class="connector-label mono" x="626.0" y="900.0" text-anchor="middle">sink emission</text><path class="connector" d="M 1305 840 L 1305 920 L 215 920 L 215 1000" data-connector-id="invocation-artifact-to-sink" data-from="pipeline-invocation-artifact" data-to="pipeline-audit-sink" marker-end="url(#arrow)" /><text class="footer-note" x="60" y="1122">Split enforcement has been the @governed default since v0.3.3.</text><text class="footer-note" x="60" y="1152">Unified enforcement preserves the same ordered gates without moving execution into AEGIS.</text></svg>
