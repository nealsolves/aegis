to="full-post-call" data-from-port="right" data-to-port="left" marker-end="url(#arrow)" /><rect x="890" y="1028" width="42" height="20" rx="7" class="connector-label-fill" data-connector-label="full-post-to-risk" /><text class="connector-label mono" x="911.0" y="1042.0" text-anchor="middle">then</text><path class="connector" d="M 900 991 L 922 991" data-connector-id="full-post-to-risk" data-from="full-post-call" data-to="full-risk" data-from-port="right" data-to-port="left" marker-end="url(#arrow)" /><rect x="620" y="1068" width="90" height="22" rx="7" class="connector-label-fill" data-connector-label="full-risk-to-invocation-evidence" /><text class="connector-label mono" x="665.0" y="1083.0" text-anchor="middle">per attempt</text><path class="connector" d="M 1012 1022 L 1012 1100 L 228 1100 L 228 1170" data-connector-id="full-risk-to-invocation-evidence" data-from="full-risk" data-to="full-invocation-artifacts" data-from-port="bottom" data-to-port="top" marker-end="url(#arrow)" /><rect x="820" y="1118" width="165" height="22" rx="7" class="connector-label-fill" data-connector-label="full-workflow-to-workflow-evidence" /><text class="connector-label mono" x="902.5" y="1133.0" text-anchor="middle">separate session evidence</text><path class="connector-muted" d="M 1104 825 L 1138 825 L 1138 1110 L 478 1110 L 478 1170" data-connector-id="full-workflow-to-workflow-evidence" data-from="full-workflow-controls" data-to="full-workflow-artifacts" data-from-port="right" data-to-port="top" marker-end="url(#arrow-muted)" /><text class="footer-note" x="60" y="1300">AEGIS remains an SDK, not a hosted runtime or orchestrator.</text><text class="footer-note" x="60" y="1328">Provider, tool, transport, retry, credential, and business-state ownership remains with the host.</text></svg>
