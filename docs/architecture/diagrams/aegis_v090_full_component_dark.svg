y="1040" width="988" height="36" rx="16" class="note-box" /><text class="body" x="608.0" y="1063.0" text-anchor="middle">pre-auth -&gt; guards -&gt; role -&gt; preconditions -&gt; tools -&gt; post-auth -&gt; pre-output -&gt; schema -&gt; postconditions -&gt; post-output -&gt; risk</text><rect x="1182" y="955" width="302" height="92" rx="16" class="note-box" /><text class="body" x="1333.0" y="985.0" text-anchor="middle">Operator tooling sits beside</text><text class="body" x="1333.0" y="1008.0" text-anchor="middle">runtime semantics.</text><text class="small" x="1333.0" y="1027.9" text-anchor="middle">The host still executes.</text><rect x="1182" y="1080" width="302" height="100" rx="16" class="note-box" /><text class="body" x="1333.0" y="1114.0" text-anchor="middle">Trace and export consume</text><text class="body" x="1333.0" y="1137.0" text-anchor="middle">emitted evidence.</text><text class="small" x="1333.0" y="1156.9" text-anchor="middle">Adapters remain optional.</text><rect x="535" y="605" width="140" height="22" rx="7" class="connector-label-fill" data-connector-label="full-policy-to-workflow" /><text class="connector-label mono" x="605.0" y="620.0" text-anchor="middle">validated contracts</text><path class="connector" d="M 927 600 L 927 635 L 217 635 L 217 710" data-connector-id="full-policy-to-workflow" data-from="full-policy-loading" data-to="full-open-session" data-from-port="bottom" data-to-port="top" marker-end="url(#arrow)" /><rect x="300" y="682" width="64" height="20" rx="7" class="connector-label-fill" data-connector-label="full-session-opens" /><text class="connector-label mono" x="332.0" y="696.0" text-anchor="middle">opens</text><path class="connector" d="M 320 745 L 344 745" data-connector-id="full-session-opens" data-from="full-open-session" data-to="full-session" data-from-port="right" data-to-port="left" marker-end="url(#arrow)" /><rect x="512" y="682" width="100" height="20" rx="7" class="connector-label-fill" data-connector-label="full-sess