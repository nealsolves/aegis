</marker></defs><rect width="1600" height="1350" fill="#0b1118" rx="24" /><rect x="36" y="36" width="1528" height="1278" class="frame" rx="24" /><text class="page-title mono" x="60" y="44">AEGIS v0.9.0 FULL</text><text class="page-subtitle" x="60" y="68">Intended full solution design surface. AEGIS remains an SDK, not a hosted runtime or orchestrator.</text><rect x="60" y="90" width="1480" height="140" rx="24" class="band" /><text class="section-tag mono" x="84" y="118">HOST APPLICATION</text><rect x="90" y="145" width="280" height="65" rx="16" class="host-box" data-node-id="full-host-app" /><text class="box-title-compact" x="230.0" y="171.0" text-anchor="middle">orchestration</text><text class="box-title-compact" x="230.0" y="194.0" text-anchor="middle">business logic</text><rect x="400" y="145" width="250" height="65" rx="16" class="host-box" data-node-id="full-model-tools" /><text class="box-title-compact" x="525.0" y="171.0" text-anchor="middle">model calls</text><text class="box-title-compact" x="525.0" y="194.0" text-anchor="middle">tool execution</text><rect x="680" y="145" width="230" height="65" rx="16" class="host-box" data-node-id="full-transport" /><text class="box-title-compact" x="795.0" y="171.0" text-anchor="middle">transport</text><text class="box-title-compact" x="795.0" y="194.0" text-anchor="middle">credentials</text><rect x="940" y="135" width="560" height="80" rx="16" class="note-box" /><text class="body" x="1220.0" y="170.5" text-anchor="middle">Host-owned execution remains outside AEGIS governance surfaces.</text><text class="small" x="1220.0" y="190.4" text-anchor="middle">Adapters normalize visible evidence; they do not replace enforcement.</text><rect x="60" y="260" width="1480" height="130" rx="24" class="adapter-panel" /><text class="section-tag mono" x="84" y="288">OPTIONAL ADAPTERS</text><rect x="100" y="315" width="250" height="54" rx="16" class="node-adapter" data-node-id="full-bedrock-adapter" /><text class="box-title-compact" x="22