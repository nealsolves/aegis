114" y="1148">EVIDENCE OUTPUTS</text><rect x="1158" y="470" width="352" height="770" rx="22" class="ops-panel" /><text class="panel-title mono" x="1182" y="498">VALIDATION + OPERATOR SURFACES</text><rect x="114" y="530" width="220" height="60" rx="16" class="node-policy" data-node-id="full-policy-yaml" /><text class="box-title-compact" x="224.0" y="553.5" text-anchor="middle">Policy YAML /</text><text class="box-title-compact" x="224.0" y="576.5" text-anchor="middle">workflow DSL</text><rect x="360" y="530" width="170" height="60" rx="16" class="node-policy" data-node-id="full-json-schemas" /><text class="box-title-compact" x="445.0" y="565.0" text-anchor="middle">JSON Schemas</text><rect x="556" y="530" width="170" height="60" rx="16" class="node-policy" data-node-id="full-manifests" /><text class="box-title-compact" x="641.0" y="565.0" text-anchor="middle">manifests</text><rect x="752" y="520" width="350" height="80" rx="16" class="node-policy" data-node-id="full-policy-loading" /><text class="box-title-compact" x="927.0" y="555.5" text-anchor="middle">policy loading / validation</text><text class="box-sub-compact" x="927.0" y="575.4" text-anchor="middle">composition / narrowing / fail closed</text><rect x="114" y="710" width="206" height="70" rx="16" class="node-workflow" data-node-id="full-open-session" /><text class="box-title-compact" x="217.0" y="750.0" text-anchor="middle">AEGIS.open_session(...)</text><rect x="344" y="710" width="206" height="70" rx="16" class="node-workflow" data-node-id="full-session" /><text class="box-title-compact" x="447.0" y="750.0" text-anchor="middle">GovernanceSession</text><rect x="574" y="710" width="206" height="70" rx="16" class="node-workflow" data-node-id="full-session-token" /><text class="box-title-compact" x="677.0" y="750.0" text-anchor="middle">SessionPreCallResult</text><rect x="114" y="800" width="206" height="50" rx="16" class="node-workflow" data-node-id="full-agent-identity" /><text class="box-title-compact" x="217.0" y="830.0" text-anchor="middle">AgentIdentity</text><rect x="344" y="800" width="206" height="50" rx="16" class="node-workflow" data-node-id="full-capability-manifest" /><text class="box-title-compact" x="447.0" y="830.0" text-anchor="middle">AgentCapabilityManifest</text><rect x="574" y="800" width="530" height="50" rx="16" class="node-workflow" data-node-id="full-workflow-controls" /><text class="box-title-compact" x="839.0" y="820.5" text-anchor="middle">handoffs / budgets / escalation checkpoints</text><text class="box-sub-compact" x="839.0" y="840.4" text-anchor="middle">session + evidence correlation</text><rect x="114" y="960" width="180" height="62" rx="16" class="node-kernel" data-node-id="full-unified-split" /><text class="box-title-compact" x="204.0" y="984.5" text-anchor="middle">unified + split</text><text class="box-title-compact" x="204.0" y="1007.5" text-anchor="middle">enforcement</text><rect x="316" y="960" width="180" height="62" rx="16" class="node-kernel" data-node-id="full-ordered-gates" /><text class="box-title-compact" x="406.0" y="996.0" text-anchor="middle">ordered gates</text><rect x="518" y="960" width="180" height="62" rx="16" class="node-kernel" data-node-id="full-pre-call" /><text class="box-title-compact" x="608.0" y="984.5" text-anchor="middle">pre-call</text><text class="box-title-compact" x="608.0" y="1007.5" text-anchor="middle">authorization</text><rect x="720" y="960" width="180" height="62" rx="16" class="node-kernel" data-node-id="full-post-call" /><text class="box-title-compact" x="810.0" y="984.5" text-anchor="middle">post-call output</text><text class="box-title-compact" x="810.0" y="1007.5" text-anchor="middle">validation</text><rect x="922" y="960" width="180" height="62" rx="16" class="node-kernel" data-node-id="full-risk" /><text class="box-title-compact" x="1012.0" y="996.0" text-anchor="middle">risk</text><rect x="114" y="1170" width="228" height="50" rx="16" class="node-evidence" data-node-id="full-invocation-arti