</marker></defs><rect width="1600" height="1460" fill="#0b1118" rx="24" /><rect x="36" y="36" width="1528" height="1388" class="frame" rx="24" /><text class="page-title mono" x="60" y="44">AEGIS v0.9 BETA</text><text class="page-subtitle" x="60" y="68">aegis-ai-governance==0.9.0b1 | public beta | released from main</text><rect x="60" y="90" width="1480" height="160" rx="24" class="band" /><text class="section-tag mono" x="84" y="118">HOST APPLICATION</text><rect x="90" y="145" width="300" height="70" rx="16" class="host-box" data-node-id="host-app" /><text class="box-title" x="240.0" y="186.2" text-anchor="middle">App / Agent / Orchestrator</text><rect x="430" y="145" width="330" height="70" rx="16" class="host-box" data-node-id="host-runtime" /><text class="box-title-compact" x="595.0" y="175.5" text-anchor="middle">Provider / Tool / Transport</text><text class="box-sub-compact" x="595.0" y="195.4" text-anchor="middle">host runtime</text><rect x="800" y="135" width="690" height="90" rx="16" class="note-box" /><text class="body" x="1145.0" y="175.5" text-anchor="middle">Host owns execution, retries, credentials, and business state.</text><text class="small" x="1145.0" y="195.4" text-anchor="middle">Provider and tool calls remain outside AEGIS after authorization.</text><rect x="60" y="280" width="1480" height="720" rx="24" class="band" /><text class="section-tag mono" x="84" y="308">AEGIS SDK v0.9.0 BETA SURFACE</text><rect x="90" y="330" width="300" height="620" rx="22" class="policy-panel" /><text class="panel-title mono" x="114" y="358">POLICY + LOADING</text><rect x="420" y="330" width="760" height="620" rx="22" class="workflow-panel" /><text class="panel-title mono" x="444" y="358">WORKFLOW + INVOCATION GOVERNANCE</text><rect x="1210" y="330" width="300" height="620" rx="22" class="evidence-panel" /><text class="panel-title mono" x="1234" y="358">EVIDENCE + SUPPORT</text><rect x="115" y="390" width="120" height="70" rx="16" class="node-policy" data-node-id="policy-yaml" /><text class="box-title-compact" x="175.0" y="430.0" text-anchor="middle">Policy YAML</text><rect x="255" y="390" width="115" height="70" rx="16" class="node-policy" data-node-id="policy-cache" /><text class="box-title-compact" x="312.5" y="430.0" text-anchor="middle">PolicyCache</text><rect x="110" y="500" width="135" height="86" rx="16" class="node-policy" data-node-id="file-policy-loader" /><text class="box-title-compact" x="177.5" y="517.5" text-anchor="middle">FilePolicy</text><text class="box-title-compact" x="177.5" y="540.5" text-anchor="middle">Loader</text><text class="box-sub-compact" x="177.5" y="560.4" text-anchor="middle">or PolicyLoader</text><text class="box-sub-compact" x="177.5" y="579.4" text-anchor="middle">Base</text><rect x="265" y="500" width="105" height="86" rx="16" class="node-policy" data-node-id="json-schemas" /><text class="box-title-compact" x="317.5" y="536.5" text-anchor="middle">JSON</text><text class="box-title-compact" x="317.5" y="559.5" text-anchor="middle">Schemas</text><rect x="450" y="390" width="160" height="78" rx="16" class="node-workflow" data-node-id="open-session" /><text class="box-title-compact" x="530.0" y="422.5" text-anchor="middle">AEGIS.</text><text class="box-title-compact" x="530.0" y="445.5" text-anchor="middle">open_session()</text><rect x="640" y="390" width="170" height="78" rx="16" class="node-workflow" data-node-id="governance-session" /><text class="box-title-compact" x="725.0" y="434.0" text-anchor="middle">GovernanceSession</text><rect x="840" y="390" width="170" height="78" rx="16" class="node-workflow" data-node-id="session-pre-call-result" /><text class="box-title-compact" x="925.0" y="413.0" text-anchor="middle">SessionPreCall</text><text class="box-title-compact" x="925.0" y="436.0" text-anchor="middle">Result</text><text class="box-sub-compact" x="925.0" y="455.9" text-anchor="middle">workflow-bound token</text><rect x="1030" y="390" width="125" height="78" rx="16" class="node-workflow" data-node-id="workflow-dsl" /><text class="box-title-compact" x="1092.5" y="403.5" text-anchor="middle">Workflow</text><text class="box-title-compact" x="1092.5" y="426.5" text-anchor="middle">DSL</text><text class="box-sub-compact" x="1092.5" y="446.4" text-anchor="middle">budgets +</text><text class="box-sub-compact" x="1092.5" y="465.4" text-anchor="middle">approvals</text><rect x="820" y="520" width="335" height="92" rx="16" class="node-evidence" data-node-id="workflow-artifact" /><text class="box-title-compact" x="987.5" y="552.0" text-anchor="middle">Workflow artifact</text><text class="box-sub-compact" x="987.5" y="571.9" text-anchor="middle">COMPLETED | FAILED</text><text class="box-sub-compact" x="987.5" y="590.9" text-anchor="middle">CANCELED | INCOMPLETE</text><rect x="450" y="690" width="170" height="82" rx="16" class="node-kernel" data-node-id="enforce-invocation" /><text class="box-title-compact" x="535.0" y="724.5" text-anchor="middle">enforce_</text><text class="box-title-compact" x="535.0" y="747.5" text-anchor="middle">invocation()</text><rect x="650" y="690" width="150" height="82" rx="16" class="node-kernel" data-node-id="aegis-enforce" /><text class="box-title-compact" x="725.0" y="736.0" text-anchor="middle">AEGIS.enforce()</text><rect x="830" y="690" width="150" height="82" rx="16" class="node-kernel" data-node-id="split-apis" /><text class="box-title-compact" x="905.0" y="726.5" text-anchor="middle">split APIs</text><text class="box-sub-compact" x="905.0" y="746.4" text-anchor="middle">pre_call / post_call</text><rect x="1010" y="690" width="145" height="82" rx="16" class="node-kernel" data-node-id="ordered-gates" /><text class="box-title-compact" x="1082.5" y="717.0" text-anchor="middle">ordered gates</text><text class="box-sub-compact" x="1082.5" y="736.9" text-anchor="middle">auth -&gt; output</text><text class="box-sub-compact" x="1082.5" y="755.9" text-anchor="middle">-&gt; risk</text><rect x="1240" y="390" width="240" height="90" rx="1