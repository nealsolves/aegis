tifact-to-sink" /><text class="connector-label mono" x="1409.0" y="509.0" text-anchor="middle">emits</text><path class="connector" d="M 1360 480 L 1360 530" data-connector-id="artifact-to-sink" data-from="invocation-artifact" data-to="audit-sink" data-from-port="bottom" data-to-port="top" marker-end="url(#arrow)" /><rect x="1372" y="638" width="82" height="22" rx="7" class="connector-label-fill" data-connector-label="sink-to-lineage" /><text class="connector-label mono" x="1413.0" y="653.0" text-anchor="middle">analyzes</text><path class="connector-muted" d="M 1360 620 L 1360 680" data-connector-id="sink-to-lineage" data-from="audit-sink" data-to="audit-lineage" data-from-port="bottom" data-to-port="top" marker-end="url(#arrow-muted)" /><rect x="60" y="1030" width="1480" height="110" rx="24" class="adapter-panel" /><text class="section-tag mono" x="84" y="1058">OPTIONAL NORMALIZATION ADAPTERS</text><rect x="90" y="1080" width="250" height="44" rx="13" class="node-adapter" data-node-id="bedrock-adapter" /><text class="box-title-compact" x="215.0" y="1107.0" text-anchor="middle">Bedrock adapter</text><rect x="365" y="1080" width="250" height="44" rx="13" class="node-adapter" data-node-id="a2a-adapter" /><text class="box-title-compact" x="490.0" y="1107.0" text-anchor="middle">A2A adapter</text><rect x="640" y="1080" width="280" height="44" rx="13" class="node-adapter" data-node-id="openai-agents-adapter" /><text class="box-title-compact" x="780.0" y="1107.0" text-anchor="middle">OpenAI Agents adapter</text><rect x="950" y="1070" width="550" height="64" rx="16" class="note-box" /><text class="body" x="1225.0" y="1107.0" text-anchor="middle">Host owns clients, credentials, transport, retries, and execution.</text><rect x="60" y="1170" width="1480" height="110" rx="24" class="ops-panel" /><text class="section-tag mono" x="84" y="1198">ADOPTION + OPERATOR TOOLING</text><rect x="90" y="1220" width="250" height="44" rx="13" class="node-ops" data-node-id="workflow-init" /><text class="box-title-compact" x="215.0" y="1247.0" text-anchor="middle">aegis workflow init</text><rect x="365" y="1220" width="250" height="44" rx="13" class="node-ops" data-node-id="workflow-lint" /><text class="box-title-compact" x="490.0" y="1247.0" text-anchor="middle">aegis workflow lint</text><rect x="640" y="1220" width="250" height="44" rx="13" class="node-ops" data-node-id="workflow-doctor" /><text class="box-title-compact" x="765.0" y="1247.0" text-anchor="middle">aegis workflow doctor</text><rect x="915" y="1220" width="250" height="44" rx="13" class="node-ops" data-node-id="workflow-trace" /><text class="box-title-compact" x="1040.0" y="1247.0" text-anchor="middle">aegis workflow trace</text><rect x="1190" y="1220" width="280" height="44" rx="13" class="node-ops" data-node-id="workflow-export" /><text class="box-title-compact" x="1330.0" y="1247.0" text-anchor="middle">aegis workflow export</text><text class="footer-note" x="60" y="1335">The host performs provider and tool calls after AEGIS authorizes a step or invocation.</text><text class="footer-note" x="60" y="1365">The beta adds workflow evidence. It does not turn AEGIS into a hosted orchestrator.</text><text class="footer-small" x="60" y="1400">Public beta: workflow sessions and adapter submodules are packaged; internal implementation details</text><text class="footer-small" x="60" y="1422">and target-state identity / manifest types are intentionally absent from this current view.</text></svg>
