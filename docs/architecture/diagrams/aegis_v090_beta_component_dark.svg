ization -&gt; guards -&gt; role -&gt; preconditions -&gt; tools</text><text class="body" x="802.5" y="882.5" text-anchor="middle">post-authorization -&gt; pre-output -&gt; schema -&gt; postconditions -&gt; post-output -&gt; risk</text><rect x="1240" y="820" width="240" height="110" rx="16" class="note-box" /><text class="body" x="1360.0" y="847.5" text-anchor="middle">Workflow evidence</text><text class="body" x="1360.0" y="870.5" text-anchor="middle">stays separate</text><text class="body" x="1360.0" y="893.5" text-anchor="middle">from invocation artifacts.</text><text class="small" x="1360.0" y="913.4" text-anchor="middle">Correlation is additive.</text><rect x="315" y="232" width="150" height="22" rx="7" class="connector-label-fill" data-connector-label="host-to-session" /><text class="connector-label mono" x="390.0" y="247.0" text-anchor="middle">governed workflow</text><path class="connector-soft" d="M 240 215 L 240 260 L 530 260 L 530 390" data-connector-id="host-to-session" data-from="host-app" data-to="open-session" data-from-port="bottom" data-to-port="top" marker-end="url(#arrow-soft)" /><rect x="272" y="750" width="100" height="22" rx="7" class="connector-label-fill" data-connector-label="loader-to-entrypoint" /><text class="connector-label mono" x="322.0" y="765.0" text-anchor="middle">loads policy</text><path class="connector" d="M 177 586 L 177 610 L 400 610 L 400 731 L 450 731" data-connector-id="loader-to-entrypoint" data-from="file-policy-loader" data-to="enforce-invocation" data-from-port="bottom" data-to-port="left" marker-end="url(#arrow)" /><rect x="592" y="472" width="65" height="22" rx="7" class="connector-label-fill" data-connector-label="open-to-session" /><text class="connector-label mono" x="624.5" y="487.0" text-anchor="middle">opens</text><path class="connector" d="M 610 429 L 640 429" data-connector-id="open-to-session" data-from="open-session" data-to="governance-session" data-from-port="right" data-to-port="left" marker-end="url(#arro