name: Security boundaries

on:
  pull_request:
  push:

jobs:
  security-boundaries:
    name: security-boundaries (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify the required RE2 engine
        run: python -c "import re2; assert re2.compile(r'^(APPROVED|REJECTED)-[0-9]{6}$').fullmatch('APPROVED-123456')"
      - name: Run RE2 platform smoke test
        run: python -m pytest tests/test_re2_platform_smoke.py -v
      - name: gate-projection-boundary
        run: python -m pytest tests/test_architecture_security_boundaries.py tests/test_evidence_emission_inventory.py -v
      - name: enforcement-boundaries
        run: python -m pytest tests/test_custom_gate_result_consistency.py tests/test_validator_hook_fail_closed.py tests/test_critical_risk_ceiling.py -v

  evidence-claims:
    name: evidence claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: demo-app-react/package-lock.json
      - name: Install Python validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install frontend extraction dependencies
        working-directory: demo-app-react
        run: npm ci
      - name: Reject evidence assurance overclaims
        run: python scripts/check_evidence_claims.py
      - name: Validate public-source compliance catalog
        run: python scripts/check_compliance_catalog.py --as-of "$(date -u +%F)"
