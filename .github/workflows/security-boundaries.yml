name: Security boundaries

on:
  pull_request:
  push:

jobs:
  security-boundaries:
    name: security-boundaries (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify the required RE2 engine
        run: python -c "import re2; assert re2.compile(r'^(APPROVED|REJECTED)-[0-9]{6}$').fullmatch('APPROVED-123456')"
      - name: Run RE2 platform smoke test
        run: python -m pytest tests/test_re2_platform_smoke.py -v
      - name: gate-projection-boundary
        run: python -m pytest tests/test_architecture_security_boundaries.py -v
      - name: enforcement-boundaries
        run: python -m pytest tests/test_custom_gate_result_consistency.py tests/test_validator_hook_fail_closed.py tests/test_critical_risk_ceiling.py -v
