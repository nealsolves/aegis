name: Deploy beta demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-demo-react.yml"
      - "demo-app-react/**"
      - "docs/architecture/diagrams/**"
  workflow_dispatch:

concurrency:
  group: pages-beta
  cancel-in-progress: true

jobs:
  build:
    name: Test and build beta frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: demo-app-react/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Require the public Render API URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [[ -z "${VITE_API_URL}" || "${VITE_API_URL}" == *"localhost"* ]]; then
            echo "Set the VITE_API_URL repository variable to the public Render service URL."
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: demo-app-react
        run: npm ci

      - name: Test frontend
        working-directory: demo-app-react
        run: npm test

      - name: Test production smoke contract
        working-directory: demo-app-react
        run: npm run test:smoke

      - name: Lint frontend
        working-directory: demo-app-react
        run: npm run lint

      - name: Check public copy
        run: python scripts/check_demo_copy.py --frontend-root demo-app-react/src

      - name: Build frontend
        working-directory: demo-app-react
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: demo-app-react/dist

  deploy:
    name: Deploy beta frontend
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
