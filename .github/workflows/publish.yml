name: Publish Python distribution to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: demo-app-react/package-lock.json

      - name: Install validation and build dependencies
        run: >-
          python -m pip install "build==1.5.0" "setuptools"
          -e ".[dev,aws-kms,gcp-kms]"

      - name: Install frontend extraction dependencies
        working-directory: demo-app-react
        run: npm ci

      - name: Run release validation
        run: |
          python scripts/check_compliance_catalog.py --as-of "$(date -u +%F)"
          python -m pytest -q
          flake8 aegis
          python scripts/check_doc_parity.py
          python scripts/check_evidence_claims.py
          python scripts/validate_v090_release_freeze.py

      - name: Build wheel and source distribution
        run: python -m build

      - name: Prove the fresh-wheel workflow
        run: >-
          python scripts/validate_v090_distribution_candidate.py
          --dist-dir dist --no-build

      - name: Store distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  validate-optional-extras:
    name: Validate optional extras (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base-wheel
            artifact: dist/aegis_ai_governance-0.9.0b1-py3-none-any.whl
            lane: base
            expected-versions: '{}'
          - name: aws-min-wheel
            artifact: dist/aegis_ai_governance-0.9.0b1-py3-none-any.whl
            lane: aws
            expected-versions: '{"boto3":"1.43.0"}'
          - name: aws-current-wheel
            artifact: dist/aegis_ai_governance-0.9.0b1-py3-none-any.whl
            lane: aws
            expected-versions: '{}'
          - name: gcp-min-wheel
            artifact: dist/aegis_ai_governance-0.9.0b1-py3-none-any.whl
            lane: gcp
            expected-versions: >-
              {"google-cloud-kms":"3.15.0","google-crc32c":"1.7.1","cryptography":"45.0.1"}
          - name: gcp-current-wheel
            artifact: dist/aegis_ai_governance-0.9.0b1-py3-none-any.whl
            lane: gcp
            expected-versions: '{}'
          - name: combined-current-wheel
            artifact: dist/aegis_ai_governance-0.9.0b1-py3-none-any.whl
            lane: combined
            expected-versions: '{}'
          - name: combined-current-sdist
            artifact: dist/aegis_ai_governance-0.9.0b1.tar.gz
            lane: combined
            expected-versions: '{}'

    steps:
      - name: Check out the release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Download the single distribution artifact set
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Validate installed artifact and optional extras
        run: >-
          python scripts/validate_kms_optional_extras.py
          --artifact "${{ matrix.artifact }}"
          --lane "${{ matrix.lane }}"
          --expected-versions '${{ matrix.expected-versions }}'

  publish:
    name: Publish distributions with PyPI Trusted Publishing
    needs: [build, validate-optional-extras]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aegis-ai-governance
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
