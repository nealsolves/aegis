name: Publish Python distribution to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation and build dependencies
        run: python -m pip install "build==1.5.0" ".[dev]"

      - name: Run release validation
        run: |
          python -m pytest -q
          flake8 aegis
          python scripts/check_doc_parity.py
          python scripts/validate_v090_release_freeze.py

      - name: Build wheel and source distribution
        run: python -m build

      - name: Prove the fresh-wheel workflow
        run: >-
          python scripts/validate_v090_distribution_candidate.py
          --dist-dir dist --no-build

      - name: Store distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish distributions with PyPI Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aegis-ai-governance
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
