schema_version: "1.0"
framework:
  id: eu-ai-act-2024-1689-amended-2026
  name: EU AI Act citation and AEGIS evidence-contribution index
  version: Regulation EU 2024/1689 as amended through Regulation EU 2026/1744
  source_date: "2026-07-24"
  authoritative_sources:
    - source_id: eu-ai-act-2024
      role: control_source
      title: Regulation EU 2024/1689 Artificial Intelligence Act
      version: Official Journal text
      publication_date: "2024-07-12"
      publication_id: CELEX:32024R1689
      url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng
      accessed_on: "2026-08-12"
    - source_id: eu-ai-digital-omnibus-2026
      role: amending_act
      title: Regulation EU 2026/1744 Digital Omnibus on AI
      version: Official Journal text
      publication_date: "2026-07-24"
      publication_id: CELEX:32026R1744
      url: https://eur-lex.europa.eu/eli/reg/2026/1744/oj/eng
      accessed_on: "2026-08-12"
declared_scope:
  summary: >-
    Bounded citation index for selected article-and-paragraph locations that
    intersect with technical governance evidence AEGIS can record or with
    explicit host and organizational gaps. This is not legal advice.
  mapping_unit: selected EU AI Act article-and-paragraph citation
  expected_mapping_count: 32
  exclusions:
    - Territorial scope, actor classification, prohibited-practice screening, and Article 6 or Annex I or Annex III high-risk classification are excluded.
    - GPAI duties, conformity assessment, registration, enforcement, penalties, and sector-specific interactions are excluded.
    - Recitals, annex contents, national law, implementing acts, delegated acts, and unofficial guidance are excluded.
    - No row decides whether a cited duty applies to an adopter, actor, system, or use case.
  applicability_statement: >-
    This citation index does not determine whether any adopter, actor, system,
    or use case is within the scope of Regulation (EU) 2024/1689.
  effective_date_basis: >-
    The source set is current through Regulation (EU) 2026/1744, published
    24 July 2026 and effective 27 July 2026. Article 113, third paragraph,
    point (c), as replaced, schedules Chapter III Sections 1 to 3 for
    2 December 2027 for systems classified under Article 6(2) and Annex III
    and 2 August 2028 for systems classified under Article 6(1) and Annex I.
    Other provisions have their own dates. Adopters must consult the official
    sources; this index does not decide which date applies to any adopter.
review:
  tier: unreviewed
  decision: pending
  contributor_github_ids: []
  reviewer_github_ids: []
  source_access_method: public_authoritative_source
controls:
  - control_id: ART-4(1)
    source_reference:
      source_id: eu-ai-digital-omnibus-2026
      locator: "Article 4, paragraph 1"
    inclusion_rationale: "Included to make an adjacent organizational or legal responsibility explicit where this catalog identifies no complete AEGIS evidence contribution."
    applicable_source_date: "2026-07-24"
    mapping:
      aegis_evidence_status: external_control
      interpretation: "ART-4(1) is retained in this bounded index to show an adjacent legal or organizational responsibility for which no complete AEGIS evidence contribution is identified."
      evidence: []
      external_owner: adopter
      external_control: "The adopter obtains legal guidance as needed, determines whether ART-4(1) applies, implements the required process, and retains operating evidence."
      host_controls:
        - owner: adopter
          control: "Determine applicability and effective dates for ART-4(1), assign accountable actors, and assess legal and evidentiary sufficiency."
        - owner: host operator
          control: Operate tenant isolation, IAM, key management, transport security, protected retention, and deletion controls.
      limitations:
        - This non-authoritative citation index is not legal advice or an applicability determination.
        - AEGIS records technical evidence contributions; it does not establish legal sufficiency or production operating effectiveness.
        - AEGIS checksums and optional signatures provide tamper-evidence within documented limits. External trust-anchor deployment is a host control. AEGIS does not provide built-in WORM or append-only storage.
      retention_assumptions:
        - The adopter reconciles Article-specific retention requirements with data-protection, employment, sector, and national law.
        - The host preserves artifacts and external trust-anchor receipts under the adopter's approved schedule and access policy.
