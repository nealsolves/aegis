      aegis_evidence_status: partial_evidence
      interpretation: "AEGIS records a bounded technical artifact or enforcement decision relevant to part of GOVERN-1.1; the wider organizational outcome remains outside AEGIS."
      evidence:
        - kind: policy_field
          baseline: aegis_source
          path: schemas/invocation_policy.schema.json
          locator: "/properties/pre_conditions"
