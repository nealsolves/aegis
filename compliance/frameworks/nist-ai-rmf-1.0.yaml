declared_scope:
  summary: >-
    Complete identifier inventory of the 72 NIST AI RMF 1.0 Core
    subcategories. Mapping text describes only bounded AEGIS technical
    evidence contributions and does not state that an outcome is achieved.
  mapping_unit: NIST AI RMF 1.0 Core subcategory identifier
  expected_mapping_count: 72
  exclusions:
    - NIST AI RMF categories, function narrative, profiles, and Playbook suggestions are not separate mapping rows.
    - Source outcome text is not reproduced; consult the cited NIST sources.
